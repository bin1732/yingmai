name: Bug 报告
description: 报告软件中遇到的问题
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: 感谢反馈，请尽量完整填写以下信息，便于复现与定位。
  - type: dropdown
    id: version-type
    attributes:
      label: 使用方式
      options:
        - 安装版（Setup）
        - 便携版
        - 源码运行
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 软件版本
      description: 可在「关于」中查看，例如 4.5.2
    validations:
      required: true
  - type: input
    attributes:
      label: 操作系统
      description: 例如 Windows 10 / Windows 11
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: 问题所属模块
      multiple: true
      options:
        - 仪表盘
        - 电商助手 / AI 引擎
        - 店铺连接
        - 商品 / 库存 / 采购
        - 订单 / 发货 / 售后
        - 客户 / 财务
        - 选品 / 竞品 / 广告
        - 语音输入
        - 双语 / 主题 / 引导
        - 手机访问
        - 安装 / 卸载
        - 其他
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: 问题描述与复现步骤
      placeholder: |
        1. 打开……
        2. 点击……
        3. 看到……
        4. 期望看到……
    validations:
      required: true
  - type: textarea
    attributes:
      label: 补充信息
      description: 截图、日志或其他有助于定位的内容（请勿包含密钥或个人隐私）
