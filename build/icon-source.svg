<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#818cf8"/>
      <stop offset="0.52" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.86" r="0.9">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.55"/>
      <stop offset="0.6" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bag" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eef2ff"/>
    </linearGradient>
  </defs>

  <!-- 应用砖 -->
  <rect x="14" y="14" width="228" height="228" rx="58" fill="url(#bg)"/>
  <rect x="14" y="14" width="228" height="228" rx="58" fill="url(#glow)"/>
  <rect x="14" y="14" width="228" height="118" rx="58" fill="#ffffff" opacity="0.10"/>

  <!-- 灵感火花 -->
  <path d="M186 70 l6.5 16.5 L209 93 l-16.5 6.5 L186 116 l-6.5-16.5 L163 93 l16.5-6.5 Z" fill="#cffafe"/>

  <!-- 购物袋提手 -->
