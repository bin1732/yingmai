  <!-- 购物袋主体 -->
  <path d="M80 122 H176 a6 6 0 0 1 6 6.4 l-7 62 A12 12 0 0 1 163.1 202 H92.9 a12 12 0 0 1-11.9-10.6 l-7-62 A6 6 0 0 1 80 122 Z" fill="url(#bag)"/>
